<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Clau ❤️</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    /* Estilo base tipo terminal elegante y romántica */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #08090d;
      background-image: radial-gradient(circle at 50% 42%, #121724 0%, #08090d 72%);
      color: #f8fafc;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      touch-action: none;
    }

    .font-serif-romantic {
      font-family: 'Cormorant Garamond', Georgia, serif;
    }

    .font-mono-tech {
      font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    /* Animación suave de aparición para la dedicatoria */
    @keyframes fadeUp {
      0% {
        opacity: 0;
        transform: translateY(10px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .animate-fade-up {
      animation: fadeUp 1.4s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .animate-fade-up-delay {
      opacity: 0;
      animation: fadeUp 1.4s cubic-bezier(0.22, 1, 0.36, 1) 0.45s forwards;
    }

    .glow-love {
      text-shadow:
        0 0 18px rgba(244, 63, 94, 0.35),
        0 0 36px rgba(255, 255, 255, 0.14);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: grab;
    }

    canvas:active {
      cursor: grabbing;
    }
  </style>
</head>
<body class="flex flex-col items-center justify-between h-[100dvh] w-screen overflow-hidden">

  <!-- Contenedor principal del lienzo 3D ASCII -->
  <main class="relative flex-1 w-full flex items-center justify-center overflow-hidden">
    <canvas id="bouquetCanvas" aria-label="Ramo de lirios blancos, hortensias y nube en 3D"></canvas>
  </main>

  <!-- Dedicatoria inferior minimalista y elegante -->
  <footer class="relative z-10 w-full flex flex-col items-center justify-center pb-6 sm:pb-8 pt-1 px-4 text-center pointer-events-none">
    <p class="font-mono-tech text-xs sm:text-sm tracking-[0.26em] uppercase text-slate-300/80 mb-1 animate-fade-up">
      Clau
    </p>
    <h1 class="font-serif-romantic text-3xl sm:text-4xl md:text-5xl font-semibold tracking-wide text-white glow-love animate-fade-up-delay">
      Te amo <span class="text-rose-500 inline-block align-middle text-2xl sm:text-3xl md:text-4xl">❤️</span>
    </h1>
    <p id="dragHint" class="font-mono-tech text-[10px] sm:text-xs tracking-[0.2em] uppercase text-slate-500 mt-3 transition-opacity duration-700">
      desliza para girar
    </p>
  </footer>

  <script>
    /**
     * Motor 3D ASCII interactivo para el ramo de Clau
     * Renderiza una nube de puntos 3D con Z-buffer, iluminación direccional
     * y caracteres ASCII de luminancia en un <canvas> optimizado para 60fps.
     */
    (function () {
      const canvas = document.getElementById('bouquetCanvas');
      const ctx = canvas.getContext('2d', { alpha: true });
      const dragHint = document.getElementById('dragHint');

      // Caracteres ordenados de menor a mayor brillo
      const LUMINANCE_CHARS = '.,-~:;=!*#$@';
      const NUBE_CHARS = ['.', '*', '+', '°'];

      // Paleta de colores RGB para lograr contraste entre flores blancas y follaje
      const COLORS = {
        lilyWhite: [255, 255, 255],       // Blanco puro para lirios
        lilyEdge: [248, 250, 252],        // Blanco suave
        lilyThroat: [187, 247, 208],      // Verde pálido en la garganta del lirio
        stamenStem: [245, 158, 11],       // Ámbar para filamentos
        stamenTip: [251, 191, 36],        // Dorado brillante para anteras

        hydrangeaPearl: [226, 232, 240],  // Blanco perla
        hydrangeaIce: [224, 242, 254],    // Matiz azul hielo muy sutil
        hydrangeaLav: [237, 233, 254],    // Matiz lavanda pálido muy sutil

        nubeWarm: [254, 249, 195],        // Blanco cálido para la nube
        nubeSoft: [241, 245, 249],        // Blanco nieve suave

        leafBright: [34, 197, 94],        // Verde esmeralda
        leafMid: [22, 163, 74],           // Verde medio
        leafDeep: [21, 128, 61],          // Verde eucalipto profundo
        stemGreen: [22, 101, 52],         // Tallos

        wrapLight: [214, 195, 165],       // Papel kraft/champagne claro
        wrapDark: [184, 159, 125],        // Papel kraft/champagne sombra
        ribbonRed: [225, 29, 72],         // Listón rojo carmesí
        ribbonHighlight: [251, 113, 133]  // Brillo del listón
      };

      // Arreglo global de puntos 3D del ramo
      const points = [];

      /**
       * Rota un vector local en los ejes X y Z para orientar cada flor hacia afuera.
       */
      function rotateLocal(x, y, z, rx, rz) {
        const cx = Math.cos(rx), sx = Math.sin(rx);
        const y1 = y * cx - z * sx;
        const z1 = y * sx + z * cx;

        const cz = Math.cos(rz), sz = Math.sin(rz);
        const x2 = x * cz - y1 * sz;
        const y2 = x * sz + y1 * cz;

        return [x2, y2, z1];
      }

      /**
       * Agrega un punto 3D con su normal, color base y tipo especial.
       */
      function addPoint(x, y, z, nx, ny, nz, rgb, kind = 'normal', phase = 0) {
        // Normalizar vector normal
        const len = Math.hypot(nx, ny, nz) || 1;
        points.push({
          x, y, z,
          nx: nx / len,
          ny: ny / len,
          nz: nz / len,
          r: rgb[0],
          g: rgb[1],
          b: rgb[2],
          kind,
          phase
        });
      }

      /**
       * 1. LIRIO BLANCO (White Lily)
       * 6 pétalos largos, puntiagudos y curvados hacia afuera,
       * garganta verde pálido y 6 estambres dorados prominentes.
       */
      function addWhiteLily(cx, cy, cz, rx, rz, scale = 1.0) {
        const petalCount = 6;

        for (let p = 0; p < petalCount; p++) {
          const baseAng = (p / petalCount) * Math.PI * 2;
          // Alternar ligeramente altura entre pétalos internos y externos
          const layerOffset = (p % 2 === 0) ? 0.0 : 0.06;
          const ca = Math.cos(baseAng);
          const sa = Math.sin(baseAng);

          const uSteps = 16;
          for (let u = 0; u <= uSteps; u++) {
            const t = u / uSteps; // 0 en la base, 1 en la punta
            // Perfil elegante en forma de trompeta que se abre y se curva suavemente
            const radial = scale * (0.08 + 0.88 * Math.pow(t, 0.88));
            const height = scale * (0.58 * Math.sin(t * Math.PI * 0.72) - 0.22 * t * t + layerOffset * t);
            // Ancho puntiagudo (más ancho en el medio, fino en la punta)
            const halfWidth = scale * 0.22 * Math.sin(Math.pow(t, 0.78) * Math.PI);

            const vSteps = t < 0.15 || t > 0.88 ? 2 : 4;
            for (let v = -vSteps; v <= vSteps; v++) {
              const frac = v / vSteps;
              const w = frac * halfWidth;
              // Ligera curvatura cóncava a lo ancho del pétalo
              const cup = 0.05 * scale * (1 - frac * frac);

              const lx = radial * ca - w * sa;
              const lz = radial * sa + w * ca;
              const ly = height + cup;

              const [wx, wy, wz] = rotateLocal(lx, ly, lz, rx, rz);
              // Normal apuntando hacia arriba y ligeramente hacia afuera
              const [wnx, wny, wnz] = rotateLocal(0.35 * ca, 0.9, 0.35 * sa, rx, rz);

              // Garganta verde pálido cerca del centro, blanco puro en el resto
              const color = t < 0.22
                ? COLORS.lilyThroat
                : (Math.abs(frac) > 0.7 ? COLORS.lilyEdge : COLORS.lilyWhite);

              addPoint(cx + wx, cy + wy, cz + wz, wnx, wny, wnz, color, 'lily');
            }
          }
        }

        // Estambres dorados saliendo del centro del lirio
        for (let s = 0; s < 6; s++) {
          const ang = (s / 6) * Math.PI * 2 + 0.25;
          const ca = Math.cos(ang);
          const sa = Math.sin(ang);

          for (let k = 1; k <= 7; k++) {
            const t = k / 7;
            const r = scale * (0.04 + 0.24 * Math.pow(t, 1.1));
            const ly = scale * (0.08 + 0.44 * t - 0.08 * t * t);
            const lx = r * ca;
            const lz = r * sa;

            const [wx, wy, wz] = rotateLocal(lx, ly, lz, rx, rz);
            const [wnx, wny, wnz] = rotateLocal(ca * 0.4, 0.9, sa * 0.4, rx, rz);
            const isTip = k >= 6;

            addPoint(
              cx + wx, cy + wy, cz + wz,
              wnx, wny, wnz,
              isTip ? COLORS.stamenTip : COLORS.stamenStem,
              isTip ? 'stamen' : 'normal'
            );
          }
        }
      }

      /**
       * 2. HORTENSIA BLANCA (White Hydrangea)
       * Pompón esponjoso formado por múltiples florecillas densas en tono
       * blanco perla con sutiles matices azul hielo y lavanda pálido.
       */
      function addWhiteHydrangea(cx, cy, cz, rx, rz, radius = 0.62) {
        const floretCount = 46;
        // Distribución de Fibonacci en semiesfera/domo para volumen natural
        const goldenAngle = Math.PI * (3 - Math.sqrt(5));

        for (let i = 0; i < floretCount; i++) {
          const t = i / (floretCount - 1);
          const yNorm = 1 - t * 1.28; // Domo redondeado
          const rRing = Math.sqrt(Math.max(0, 1 - yNorm * yNorm));
          const theta = goldenAngle * i;

          // Pequeña variación orgánica en el radio
          const jitter = 0.9 + 0.16 * Math.sin(i * 12.7);
          const fx = rRing * Math.cos(theta) * radius * jitter;
          const fy = (yNorm * 0.78 + 0.25) * radius * jitter;
          const fz = rRing * Math.sin(theta) * radius * jitter;

          // Elegir matiz sutil para dar profundidad de nube esponjosa
          let floretColor = COLORS.hydrangeaPearl;
          if (i % 3 === 0) floretColor = COLORS.hydrangeaIce;
          else if (i % 5 === 0) floretColor = COLORS.hydrangeaLav;

          // Cada florecilla tiene 4 mini-pétalos en cruz
          const floretSize = radius * 0.19;
          for (let p = 0; p < 4; p++) {
            const pa = (p / 4) * Math.PI * 2 + (i * 0.7);
            const px = fx + Math.cos(pa) * floretSize;
            const py = fy + Math.sin(pa) * floretSize * 0.45;
            const pz = fz + Math.sin(pa) * floretSize;

            const [wx, wy, wz] = rotateLocal(px, py, pz, rx, rz);
            const [wnx, wny, wnz] = rotateLocal(fx, fy + 0.2, fz, rx, rz);

            addPoint(cx + wx, cy + wy, cz + wz, wnx, wny, wnz, floretColor, 'hydrangea');
          }

          // Centro de la florecilla
          const [wx, wy, wz] = rotateLocal(fx, fy, fz, rx, rz);
          const [wnx, wny, wnz] = rotateLocal(fx, fy + 0.2, fz, rx, rz);
          addPoint(cx + wx, cy + wy, cz + wz, wnx, wny, wnz, COLORS.lilyWhite, 'hydrangea');
        }
      }

      /**
       * 3. FOLLAJE "NUBE" (Baby's Breath / Gypsophila)
       * Ramitas finas con constelaciones de diminutas estrellas blancas
       * que centellean suavemente alrededor de las flores principales.
       */
      function addBabysBreathSprig(x0, y0, z0, x1, y1, z1, seed) {
        // Tallo muy fino
        const steps = 12;
        for (let i = 1; i <= steps; i++) {
          const t = i / steps;
          const px = x0 + (x1 - x0) * t;
          const py = y0 + (y1 - y0) * t;
          const pz = z0 + (z1 - z0) * t;
          addPoint(px, py, pz, 0, 1, 0, COLORS.leafDeep, 'normal');
        }

        // Pequeña nube de florecillas diminutas en la punta
        const clusterPoints = 14;
        for (let k = 0; k < clusterPoints; k++) {
          const a1 = (k * 2.39996) + seed;
          const a2 = Math.sin(k * 1.7 + seed) * 1.1;
          const dist = 0.14 + 0.28 * ((k % 5) / 4);

          const ox = Math.cos(a1) * Math.cos(a2) * dist;
          const oy = Math.sin(a2) * dist * 0.8 + 0.08;
          const oz = Math.sin(a1) * Math.cos(a2) * dist;

          const color = k % 2 === 0 ? COLORS.nubeWarm : COLORS.nubeSoft;
          addPoint(x1 + ox, y1 + oy, z1 + oz, 0, 1, 0.5, color, 'nube', seed + k * 0.9);
        }
      }

      /**
       * 4. TALLOS Y HOJAS VERDES (Eucalipto y follaje esmeralda)
       */
      function addStem(x0, y0, z0, x1, y1, z1) {
        const steps = 22;
        for (let i = 0; i <= steps; i++) {
          const t = i / steps;
          const px = x0 + (x1 - x0) * t;
          const py = y0 + (y1 - y0) * t;
          const pz = z0 + (z1 - z0) * t;
          for (let k = 0; k < 5; k++) {
            const ang = (k / 5) * Math.PI * 2;
            const r = 0.04;
            addPoint(
              px + r * Math.cos(ang),
              py,
              pz + r * Math.sin(ang),
              Math.cos(ang), 0.15, Math.sin(ang),
              COLORS.stemGreen
            );
          }
        }
      }

      function addLeaf(bx, by, bz, angY, tilt, length = 1.05, width = 0.30, shade = 0) {
        const ca = Math.cos(angY);
        const sa = Math.sin(angY);
        const leafColor = shade === 0 ? COLORS.leafBright : (shade === 1 ? COLORS.leafMid : COLORS.leafDeep);

        for (let u = 1; u <= 13; u++) {
          const t = u / 13;
          const dist = length * t;
          const wMax = width * Math.sin(t * Math.PI);
          const arch = 0.22 * Math.sin(t * Math.PI) - 0.10 * t * t;

          for (let v = -3; v <= 3; v++) {
            const w = (v / 3) * wMax;
            const lx = dist;
            const ly = dist * tilt + arch;
            const lz = w;

            const x = lx * ca - lz * sa;
            const z = lx * sa + lz * ca;
            addPoint(bx + x, by + ly, bz + z, 0.2 * ca, 0.92, 0.2 * sa, leafColor);
          }
        }
      }

      /**
       * 5. ENVOLTURA DE PAPEL CHAMPAGNE/KRAFT Y LISTÓN CARMESÍ
       */
      function addWrappingAndRibbon() {
        // Cono superior de papel
        for (let i = 0; i < 28; i++) {
          const t = i / 27;
          const y = -0.35 + t * 1.62;
          const rBase = 0.30 + t * 1.32;

          for (let j = 0; j < 56; j++) {
            const theta = (j / 56) * Math.PI * 2;
            // Borde superior suavemente ondulado como papel doblado
            const yWave = y + 0.16 * Math.sin(4 * theta + 0.5) * t;
            const x = rBase * Math.cos(theta);
            const z = rBase * Math.sin(theta);
            const color = (Math.sin(4 * theta) > 0) ? COLORS.wrapLight : COLORS.wrapDark;
            addPoint(x, yWave, z, Math.cos(theta), 0.25, Math.sin(theta), color);
          }
        }

        // Base inferior del papel (debajo del listón)
        for (let i = 0; i < 12; i++) {
          const t = i / 11;
          const y = -0.35 - t * 0.78;
          const rBase = 0.30 + t * 0.28;
          for (let j = 0; j < 30; j++) {
            const theta = (j / 30) * Math.PI * 2;
            const x = rBase * Math.cos(theta);
            const z = rBase * Math.sin(theta);
            addPoint(x, y, z, Math.cos(theta), -0.25, Math.sin(theta), COLORS.wrapDark);
          }
        }

        // Listón rojo satinado en la cintura del ramo
        for (let i = 0; i < 6; i++) {
          const y = -0.45 + i * 0.04;
          for (let j = 0; j < 36; j++) {
            const theta = (j / 36) * Math.PI * 2;
            const r = 0.36;
            const color = (i === 2 || i === 3) ? COLORS.ribbonHighlight : COLORS.ribbonRed;
            addPoint(r * Math.cos(theta), y, r * Math.sin(theta), Math.cos(theta), 0.0, Math.sin(theta), color);
          }
        }

        // Dos colas elegantes del listón cayendo al frente
        for (let side of [-1, 1]) {
          for (let k = 0; k < 14; k++) {
            const t = k / 13;
            const rx = side * (0.08 + 0.24 * t);
            const ry = -0.42 - 0.62 * t;
            const rz = 0.38 + 0.08 * Math.sin(t * Math.PI);
            addPoint(rx, ry, rz, 0, 0.2, 1, COLORS.ribbonRed);
            addPoint(rx + side * 0.04, ry, rz, 0, 0.2, 1, COLORS.ribbonHighlight);
          }
        }
      }

      /**
       * Construye el ramo completo combinando lirios, hortensias, nube y follaje.
       */
      function buildBouquet() {
        addWrappingAndRibbon();

        // 4 Lirios blancos protagonistas (arriba y hacia los lados)
        const lilies = [
          { x: 0.0, y: 2.38, z: 0.12, rx: 0.12, rz: 0.0, scale: 1.05 },
          { x: 0.92, y: 1.98, z: 0.42, rx: 0.34, rz: -0.46, scale: 0.96 },
          { x: -0.94, y: 2.02, z: 0.36, rx: 0.30, rz: 0.48, scale: 0.96 },
          { x: 0.06, y: 2.05, z: -0.88, rx: -0.42, rz: -0.05, scale: 0.94 }
        ];

        lilies.forEach(l => {
          addStem(l.x * 0.12, -1.6, l.z * 0.12, l.x, l.y - 0.1, l.z);
          addWhiteLily(l.x, l.y, l.z, l.rx, l.rz, l.scale);
        });

        // 4 Hortensias blancas esponjosas dando volumen redondeado
        const hydrangeas = [
          { x: 0.82, y: 1.68, z: -0.56, rx: -0.25, rz: -0.35, r: 0.62 },
          { x: -0.82, y: 1.70, z: -0.52, rx: -0.25, rz: 0.35, r: 0.62 },
          { x: 0.04, y: 1.56, z: 0.94, rx: 0.42, rz: 0.0, r: 0.60 },
          { x: 1.18, y: 1.38, z: 0.02, rx: 0.05, rz: -0.55, r: 0.54 }
        ];

        hydrangeas.forEach(h => {
          addStem(h.x * 0.14, -1.55, h.z * 0.14, h.x, h.y - 0.15, h.z);
          addWhiteHydrangea(h.x, h.y, h.z, h.rx, h.rz, h.r);
        });

        // Hojas verdes rodeando el ramo para enmarcar el blanco
        for (let k = 0; k < 12; k++) {
          const ang = (k / 12) * Math.PI * 2 + 0.18;
          const r = 0.92 + (k % 2) * 0.14;
          addLeaf(
            r * Math.cos(ang),
            1.02 + (k % 3) * 0.12,
            r * Math.sin(ang),
            ang,
            0.42 + (k % 2) * 0.12,
            1.02,
            0.29,
            k % 3
          );
        }

        // Follaje "Nube" (Baby's Breath) flotando suavemente entre y alrededor de las flores
        const nubeSpots = [
          [0.52, 2.48, 0.52],
          [-0.54, 2.46, 0.50],
          [0.58, 2.38, -0.45],
          [-0.58, 2.36, -0.46],
          [1.36, 1.88, 0.42],
          [-1.36, 1.86, 0.38],
          [1.26, 1.85, -0.52],
          [-1.26, 1.82, -0.52],
          [0.0, 1.98, 1.24],
          [0.0, 2.32, -1.22]
        ];

        nubeSpots.forEach((pos, idx) => {
          addBabysBreathSprig(
            pos[0] * 0.35, 1.05, pos[2] * 0.35,
            pos[0], pos[1], pos[2],
            idx * 1.37
          );
        });
      }

      // Estado de cámara e interacción
      let angleY = 0.3;
      let angleX = 0.22; // Inclinación suave desde arriba
      let velY = 0.0085; // Auto-rotación fluida
      let isDragging = false;
      let lastX = 0;
      let lastY = 0;
      let hasInteracted = false;

      // Dimensiones de la grilla ASCII
      let cols = 90;
      let rows = 46;
      let cellW = 8;
      let cellH = 14;
      let fontSize = 12;
      let dpr = 1;

      function resizeCanvas() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        const rect = canvas.parentElement.getBoundingClientRect();
        canvas.width = Math.floor(rect.width * dpr);
        canvas.height = Math.floor(rect.height * dpr);

        // Ajustar densidad de caracteres según el tamaño de pantalla (móvil vs escritorio)
        const isSmallMobile = rect.width < 480;
        fontSize = isSmallMobile ? 9.5 : (rect.width < 900 ? 11 : 12.5);
        cellW = fontSize * 0.62;
        cellH = fontSize * 1.12;

        cols = Math.max(46, Math.floor(rect.width / cellW));
        rows = Math.max(30, Math.floor(rect.height / cellH));
      }

      // Eventos de mouse y touch para girar el ramo
      function onPointerDown(e) {
        isDragging = true;
        lastX = e.clientX;
        lastY = e.clientY;
        if (!hasInteracted && dragHint) {
          hasInteracted = true;
          dragHint.style.opacity = '0';
        }
      }

      function onPointerMove(e) {
        if (!isDragging) return;
        const dx = e.clientX - lastX;
        const dy = e.clientY - lastY;
        lastX = e.clientX;
        lastY = e.clientY;

        angleY += dx * 0.011;
        angleX = Math.max(-0.25, Math.min(0.75, angleX + dy * 0.006));
        velY = dx * 0.004;
      }

      function onPointerUp() {
        isDragging = false;
      }

      canvas.addEventListener('pointerdown', onPointerDown);
      window.addEventListener('pointermove', onPointerMove);
      window.addEventListener('pointerup', onPointerUp);
      window.addEventListener('pointercancel', onPointerUp);
      window.addEventListener('resize', resizeCanvas);

      // Buffers reutilizables para máximo rendimiento
      let zBuffer = new Float32Array(0);
      let charBuffer = [];
      let colorBuffer = [];
      let glowBuffer = new Uint8Array(0);

      function ensureBuffers(size) {
        if (zBuffer.length !== size) {
          zBuffer = new Float32Array(size);
          charBuffer = new Array(size);
          colorBuffer = new Array(size);
          glowBuffer = new Uint8Array(size);
        }
      }

      /**
       * Bucle principal de renderizado (60fps)
       */
      function render(timeMs) {
        const tSec = timeMs * 0.001;

        if (!isDragging) {
          angleY += velY;
          // Suavizar inercia hasta regresar a la velocidad de giro constante
          velY += (0.0085 - velY) * 0.03;
        }

        const totalCells = cols * rows;
        ensureBuffers(totalCells);
        zBuffer.fill(-1e9);
        charBuffer.fill('');
        glowBuffer.fill(0);

        const cosY = Math.cos(angleY);
        const sinY = Math.sin(angleY);
        const cosX = Math.cos(angleX);
        const sinX = Math.sin(angleX);

        // Dirección de luz direccional
        const lx = 0.35, ly = 0.62, lz = 0.70;
        const camDist = 7.4;
        const centerY = 0.52;

        // Escala proporcional para que el ramo siempre quede bien encuadrado
        const minDim = Math.min(cols * 0.56, rows);
        const scale = minDim * 2.12;
        const halfCols = cols * 0.5;
        const halfRows = rows * 0.5;

        for (let i = 0; i < points.length; i++) {
          const p = points[i];
          const yc = p.y - centerY;

          // Rotación en Y (giro horizontal)
          const rx = p.x * cosY + p.z * sinY;
          const rz = -p.x * sinY + p.z * cosY;

          // Inclinación en X
          const ty = yc * cosX - rz * sinX;
          const tz = yc * sinX + rz * cosX;

          const zDist = camDist - tz;
          if (zDist <= 0.2) continue;

          const invZ = 1.0 / zDist;
          const px = Math.floor(halfCols + scale * rx * invZ * 1.72);
          const py = Math.floor(halfRows - scale * ty * invZ * 0.96);

          if (px >= 0 && px < cols && py >= 0 && py < rows) {
            const idx = py * cols + px;
            if (invZ > zBuffer[idx]) {
              zBuffer[idx] = invZ;

              // Rotar normal para iluminación realista
              const rnx = p.nx * cosY + p.nz * sinY;
              const rnz = -p.nx * sinY + p.nz * cosY;
              const tny = p.ny * cosX - rnz * sinX;
              const tnz = p.ny * sinX + rnz * cosX;

              const dot = rnx * lx + tny * ly + tnz * lz;
              const shade = Math.max(0.28, Math.min(1.0, dot * 0.48 + 0.62));

              if (p.kind === 'nube') {
                // Efecto de centelleo delicado para la "nube"
                const twinkle = 0.5 + 0.5 * Math.sin(tSec * 2.6 + p.phase);
                const charIndex = Math.floor(twinkle * NUBE_CHARS.length) % NUBE_CHARS.length;
                charBuffer[idx] = NUBE_CHARS[charIndex];
                const alpha = 0.58 + 0.42 * twinkle;
                colorBuffer[idx] = `rgba(${p.r},${p.g},${p.b},${alpha.toFixed(2)})`;
                glowBuffer[idx] = twinkle > 0.72 ? 1 : 0;
              } else {
                const lumIndex = Math.min(
                  LUMINANCE_CHARS.length - 1,
                  Math.max(0, Math.floor(shade * (LUMINANCE_CHARS.length - 1)))
                );
                charBuffer[idx] = LUMINANCE_CHARS[lumIndex];

                const cr = Math.min(255, Math.round(p.r * shade));
                const cg = Math.min(255, Math.round(p.g * shade));
                const cb = Math.min(255, Math.round(p.b * shade));
                colorBuffer[idx] = `rgb(${cr},${cg},${cb})`;
                glowBuffer[idx] = (p.kind === 'stamen' || (p.kind === 'lily' && shade > 0.92)) ? 1 : 0;
              }
            }
          }
        }

        // Dibujar en el canvas
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        const viewW = canvas.width / dpr;
        const viewH = canvas.height / dpr;
        ctx.clearRect(0, 0, viewW, viewH);

        ctx.font = `500 ${fontSize}px 'JetBrains Mono', monospace`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        const offsetX = (viewW - cols * cellW) * 0.5 + cellW * 0.5;
        const offsetY = (viewH - rows * cellH) * 0.5 + cellH * 0.5;

        for (let r = 0; r < rows; r++) {
          const yPos = offsetY + r * cellH;
          const rowOffset = r * cols;
          for (let c = 0; c < cols; c++) {
            const idx = rowOffset + c;
            const ch = charBuffer[idx];
            if (!ch) continue;

            const xPos = offsetX + c * cellW;
            if (glowBuffer[idx]) {
              ctx.shadowColor = colorBuffer[idx];
              ctx.shadowBlur = 7;
            } else {
              ctx.shadowBlur = 0;
            }
            ctx.fillStyle = colorBuffer[idx];
            ctx.fillText(ch, xPos, yPos);
          }
        }
        ctx.shadowBlur = 0;

        requestAnimationFrame(render);
      }

      // Inicializar al cargar la ventana
      window.onload = function () {
        buildBouquet();
        resizeCanvas();
        requestAnimationFrame(render);
      };
    })();
  </script>
</body>
</html>
