<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Para Clau">
  <title>Para Clau ❤️</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #09090d;
      color: #ffffff;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-user-select: none;
      user-select: none;
      touch-action: none;
    }
    #scene {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    footer {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 10;
      text-align: center;
      padding: 16px 16px calc(22px + env(safe-area-inset-bottom, 0px));
      background: linear-gradient(to top, rgba(9, 9, 13, 0.92) 55%, rgba(9, 9, 13, 0));
      pointer-events: none;
    }
    .nombre {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 16px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: #d7dbe6;
      margin-bottom: 4px;
    }
    h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-weight: normal;
      font-size: 30px;
      color: #ffffff;
      text-shadow: 0 0 18px rgba(255, 255, 255, 0.28);
      margin-bottom: 6px;
    }
    .hint {
      font-size: 12px;
      letter-spacing: 0.14em;
      color: #7c8294;
      text-transform: lowercase;
    }
  </style>
</head>
<body>
  <canvas id="scene" aria-label="Ramo de lirios blancos, hortensias y nube en 3D"></canvas>

  <footer>
    <p class="nombre">Clau</p>
    <h1>Te amo ❤️</h1>
    <p class="hint">desliza para girar</p>
  </footer>

  <script>
    (function () {
      var canvas = document.getElementById("scene");
      var ctx = canvas.getContext("2d");
      var LUM = ".,-~:;=!*#$@";

      // Paleta de tonos para distinguir flores blancas, nube, follaje y envoltura
      var C_LIRIO = "#ffffff";
      var C_LIRIO_C = "#d9f2b4";
      var C_ESTAMBRE = "#f5c542";
      var C_HORT1 = "#e8eef8";
      var C_HORT2 = "#d4dcf0";
      var C_NUBE = "#fff8e7";
      var C_HOJA = "#3fa362";
      var C_TALLO = "#256b40";
      var C_PAPEL = "#c9a882";
      var C_LISTON = "#d93848";

      function rotLocal(x, y, z, rx, rz) {
        var cx = Math.cos(rx), sx = Math.sin(rx);
        var y1 = y * cx - z * sx;
        var z1 = y * sx + z * cx;
        var cz = Math.cos(rz), sz = Math.sin(rz);
        return [x * cz - y1 * sz, x * sz + y1 * cz, z1];
      }

      function addLirio(pts, cx, cy, cz, rx, rz, escala) {
        var s = escala || 0.72;
        var p, u, v, ang, ca, sa, t, dist, ancho, curva, w, lx, ly, lz, pos, norm;
        // 6 pétalos largos y puntiagudos
        for (p = 0; p < 6; p++) {
          ang = (p / 6) * Math.PI * 2;
          ca = Math.cos(ang);
          sa = Math.sin(ang);
          for (u = 1; u <= 11; u++) {
            t = u / 11;
            dist = s * (0.12 + 0.92 * t);
            ancho = s * 0.25 * Math.sin(Math.pow(t, 0.8) * Math.PI);
            curva = s * (0.48 * t - 0.34 * t * t * t);
            for (v = -2; v <= 2; v++) {
              w = (v / 2) * ancho;
              lx = dist * ca - w * sa;
              lz = dist * sa + w * ca;
              ly = curva;
              pos = rotLocal(lx, ly, lz, rx, rz);
              norm = rotLocal(0.25 * ca, 0.92, 0.25 * sa, rx, rz);
              pts.push([
                cx + pos[0], cy + pos[1], cz + pos[2],
                norm[0], norm[1], norm[2],
                t < 0.28 ? C_LIRIO_C : C_LIRIO
              ]);
            }
          }
        }
        // Estambres dorados en el centro
        for (p = 0; p < 6; p++) {
          ang = (p / 6) * Math.PI * 2 + 0.3;
          for (u = 1; u <= 5; u++) {
            t = u / 5;
            pos = rotLocal(
              s * 0.22 * t * Math.cos(ang),
              s * (0.1 + 0.42 * t),
              s * 0.22 * t * Math.sin(ang),
              rx, rz
            );
            pts.push([
              cx + pos[0], cy + pos[1], cz + pos[2],
              0, 1, 0,
              u >= 4 ? C_ESTAMBRE : C_LIRIO_C
            ]);
          }
        }
      }

      function addHortensia(pts, cx, cy, cz, radio) {
        var r = radio || 0.56;
        var i, j, phi, theta, x, y, z, col;
        // Esfera esponjosa formada por racimos de florecitas
        for (i = 0; i < 42; i++) {
          phi = Math.acos(1 - 2 * ((i + 0.5) / 42));
          theta = Math.PI * (1 + Math.sqrt(5)) * i;
          var fx = r * Math.sin(phi) * Math.cos(theta);
          var fy = r * 0.88 * Math.cos(phi);
          var fz = r * Math.sin(phi) * Math.sin(theta);
          col = (i % 3 === 0) ? C_HORT2 : C_HORT1;
          for (j = 0; j < 5; j++) {
            var a = (j / 5) * Math.PI * 2;
            var off = 0.085;
            x = fx + off * Math.cos(a);
            y = fy + off * Math.sin(a) * 0.6;
            z = fz + off * Math.sin(a);
            pts.push([
              cx + x, cy + y, cz + z,
              fx / r, fy / r, fz / r,
              col
            ]);
          }
        }
      }

      function addTallo(pts, x0, y0, z0, x1, y1, z1) {
        var i, t, px, py, pz, k, ang;
        for (i = 0; i <= 18; i++) {
          t = i / 18;
          px = x0 + (x1 - x0) * t;
          py = y0 + (y1 - y0) * t;
          pz = z0 + (z1 - z0) * t;
          for (k = 0; k < 4; k++) {
            ang = (k / 4) * Math.PI * 2;
            pts.push([
              px + 0.04 * Math.cos(ang), py, pz + 0.04 * Math.sin(ang),
              Math.cos(ang), 0.2, Math.sin(ang),
              C_TALLO
            ]);
          }
        }
      }

      function addHoja(pts, bx, by, bz, angY, incl) {
        var ca = Math.cos(angY), sa = Math.sin(angY);
        var u, v, t, dist, wMax, arch, w, lx, ly, lz;
        for (u = 1; u <= 11; u++) {
          t = u / 11;
          dist = 0.92 * t;
          wMax = 0.24 * Math.sin(t * Math.PI);
          arch = 0.2 * Math.sin(t * Math.PI);
          for (v = -2; v <= 2; v++) {
            w = (v / 2) * wMax;
            lx = dist;
            ly = dist * incl + arch;
            lz = w;
            pts.push([
              bx + lx * ca - lz * sa,
              by + ly,
              bz + lx * sa + lz * ca,
              0.2 * ca, 0.9, 0.2 * sa,
              C_HOJA
            ]);
          }
        }
      }

      function construirRamo() {
        var pts = [];
        var i, j, t, y, rBase, theta, yOnd;

        // 1. Papel kraft superior
        for (i = 0; i < 22; i++) {
          t = i / 21;
          y = -0.35 + t * 1.48;
          rBase = 0.26 + t * 1.24;
          for (j = 0; j < 44; j++) {
            theta = (j / 44) * Math.PI * 2;
            yOnd = y + 0.11 * Math.sin(5 * theta) * t;
            pts.push([
              rBase * Math.cos(theta), yOnd, rBase * Math.sin(theta),
              Math.cos(theta), 0.3, Math.sin(theta),
              C_PAPEL
            ]);
          }
        }
        // Base del papel
        for (i = 0; i < 10; i++) {
          t = i / 9;
          y = -0.35 - t * 0.72;
          rBase = 0.26 + t * 0.24;
          for (j = 0; j < 24; j++) {
            theta = (j / 24) * Math.PI * 2;
            pts.push([
              rBase * Math.cos(theta), y, rBase * Math.sin(theta),
              Math.cos(theta), -0.2, Math.sin(theta),
              C_PAPEL
            ]);
          }
        }

        // 2. Listón rojo
        for (i = 0; i < 5; i++) {
          y = -0.44 + i * 0.045;
          for (j = 0; j < 28; j++) {
            theta = (j / 28) * Math.PI * 2;
            pts.push([
              0.33 * Math.cos(theta), y, 0.33 * Math.sin(theta),
              Math.cos(theta), 0, Math.sin(theta),
              C_LISTON
            ]);
          }
        }

        // 3. Lirios blancos principales
        var lirios = [
          [0.0, 2.22, 0.05, 0.15, 0.0, 0.76],
          [0.86, 1.88, 0.45, 0.42, -0.45, 0.68],
          [-0.86, 1.92, 0.40, 0.42, 0.45, 0.68],
          [0.02, 1.92, -0.86, -0.48, 0.0, 0.68]
        ];
        for (i = 0; i < lirios.length; i++) {
          var l = lirios[i];
          addTallo(pts, l[0] * 0.12, -1.55, l[2] * 0.12, l[0], l[1] - 0.12, l[2]);
          addLirio(pts, l[0], l[1], l[2], l[3], l[4], l[5]);
        }

        // 4. Hortensias blancas (volumen esponjoso)
        var hortensias = [
          [0.72, 1.48, -0.58, 0.56],
          [-0.74, 1.50, -0.52, 0.56],
          [0.02, 1.45, 0.85, 0.54]
        ];
        for (i = 0; i < hortensias.length; i++) {
          var h = hortensias[i];
          addTallo(pts, h[0] * 0.12, -1.55, h[2] * 0.12, h[0], h[1] - 0.25, h[2]);
          addHortensia(pts, h[0], h[1], h[2], h[3]);
        }

        // 5. Follaje de "nube" (destellos delicados alrededor)
        for (i = 0; i < 150; i++) {
          var ang = i * 2.39996;
          var rad = 0.45 + ((i * 37) % 100) / 100 * 1.15;
          var ny = 1.2 + ((i * 53) % 100) / 100 * 1.35;
          pts.push([
            rad * Math.cos(ang), ny, rad * Math.sin(ang),
            0, 1, 0,
            C_NUBE
          ]);
        }

        // 6. Hojas verdes rodeando el ramo
        for (i = 0; i < 8; i++) {
          var ha = (i / 8) * Math.PI * 2 + 0.25;
          addHoja(pts, 0.9 * Math.cos(ha), 1.02, 0.9 * Math.sin(ha), ha, 0.42);
        }

        return pts;
      }

      var puntos = construirRamo();
      var angulo = 0;
      var velocidad = 0.018;
      var dragging = false;
      var lastX = 0;

      // Interacción táctil y con mouse
      function startDrag(x) { dragging = true; lastX = x; }
      function moveDrag(x) {
        if (!dragging) return;
        angulo += (x - lastX) * 0.01;
        lastX = x;
      }
      function endDrag() { dragging = false; }

      canvas.addEventListener("touchstart", function (e) {
        if (e.touches.length) startDrag(e.touches[0].clientX);
      }, { passive: true });
      canvas.addEventListener("touchmove", function (e) {
        if (e.touches.length) moveDrag(e.touches[0].clientX);
      }, { passive: true });
      canvas.addEventListener("touchend", endDrag, { passive: true });
      canvas.addEventListener("mousedown", function (e) { startDrag(e.clientX); });
      window.addEventListener("mousemove", function (e) { moveDrag(e.clientX); });
      window.addEventListener("mouseup", endDrag);

      var W = 0, H = 0, cols = 60, rows = 50, fontSize = 10, cw = 6, ch = 10;
      var zbuf = [];
      var chBuf = [];
      var colBuf = [];

      function resize() {
        var dpr = Math.min(window.devicePixelRatio || 1, 2);
        W = window.innerWidth || document.documentElement.clientWidth;
        H = window.innerHeight || document.documentElement.clientHeight;
        canvas.width = Math.floor(W * dpr);
        canvas.height = Math.floor(H * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        fontSize = Math.max(8, Math.min(12, Math.floor(W / 44)));
        cw = fontSize * 0.62;
        ch = fontSize * 1.05;
        cols = Math.max(30, Math.floor(W / cw));
        rows = Math.max(30, Math.floor((H - 115) / ch));

        var total = cols * rows;
        zbuf = new Float32Array(total);
        chBuf = new Array(total);
        colBuf = new Array(total);
      }

      window.addEventListener("resize", resize);
      resize();

      var cosT = Math.cos(0.24), sinT = Math.sin(0.24);
      var lx = 0.35, ly = 0.58, lz = 0.74;

      function render() {
        if (!dragging) angulo += velocidad;
        var cosA = Math.cos(angulo), sinA = Math.sin(angulo);
        var total = cols * rows;
        var i;

        for (i = 0; i < total; i++) {
          zbuf[i] = -1e9;
          chBuf[i] = "";
        }

        var aspect = ch / cw;
        var unit = Math.min((cols * 1.32) / aspect, rows * 1.12);
        var scaleY = unit;
        var scaleX = unit * aspect;
        var halfC = cols * 0.5;
        var halfR = rows * 0.52;

        for (i = 0; i < puntos.length; i++) {
          var p = puntos[i];
          var yc = p[1] - 0.45;
          var rx = p[0] * cosA + p[2] * sinA;
          var rz = -p[0] * sinA + p[2] * cosA;
          var ty = yc * cosT - rz * sinT;
          var tz = yc * sinT + rz * cosT;
          var zDist = 7.0 - tz;
          if (zDist <= 0.1) continue;

          var invZ = 1 / zDist;
          var px = Math.floor(halfC + scaleX * rx * invZ);
          var py = Math.floor(halfR - scaleY * ty * invZ);

          if (px >= 0 && px < cols && py >= 0 && py < rows) {
            var idx = py * cols + px;
            if (invZ > zbuf[idx]) {
              zbuf[idx] = invZ;
              var rnx = p[3] * cosA + p[5] * sinA;
              var rnz = -p[3] * sinA + p[5] * cosA;
              var tny = p[4] * cosT - rnz * sinT;
              var tnz = p[4] * sinT + rnz * cosT;
              var lum = rnx * lx + tny * ly + tnz * lz;
              var b = Math.max(0.18, Math.min(1, lum * 0.5 + 0.56));
              chBuf[idx] = LUM[Math.floor(b * (LUM.length - 1))];
              colBuf[idx] = p[6];
            }
          }
        }

        ctx.fillStyle = "#09090d";
        ctx.fillRect(0, 0, W, H);
        ctx.font = fontSize + "px Menlo, Monaco, Consolas, monospace";
        ctx.textBaseline = "top";

        var offX = (W - cols * cw) * 0.5;
        var offY = 14;
        var lastCol = "";

        for (var r = 0; r < rows; r++) {
          var rowBase = r * cols;
          var yPos = offY + r * ch;
          for (var c = 0; c < cols; c++) {
            var chChar = chBuf[rowBase + c];
            if (chChar) {
              var col = colBuf[rowBase + c];
              if (col !== lastCol) {
                ctx.fillStyle = col;
                lastCol = col;
              }
              ctx.fillText(chChar, offX + c * cw, yPos);
            }
          }
        }

        window.requestAnimationFrame(render);
      }

      window.requestAnimationFrame(render);
    })();
  </script>
</body>
</html>
